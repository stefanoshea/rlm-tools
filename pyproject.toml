[project]
name = "rlm-tools"
version = "0.2.6"
description = "MCP server providing a persistent Python sandbox for token-efficient codebase exploration across MCP clients"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "anyio>=4.14.2",
    "mcp>=1.30.0,<2",
    "google-re2>=1.1",
    "anthropic>=0.40.0",
    "httpx>=0.27",
]

[project.scripts]
rlm-tools = "rlm_tools.server:main"
rlm-tools-setup = "rlm_tools.setup_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm_tools"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
]
semantic = [
    "typesafe-sdk>=0.7.5",
]
gemini = [
    "google-genai>=3.2.0; python_version >= '3.11'",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "evals"]
# Fixture corpora under tests/fixtures are sample codebases the evals run
# against, not test modules — never collect them.
norecursedirs = ["tests/fixtures", "*.egg", ".git", ".tox", ".venv", "build", "dist"]

[project.urls]
Homepage = "https://github.com/stefanoshea/rlm-tools"
Repository = "https://github.com/stefanoshea/rlm-tools"
Issues = "https://github.com/stefanoshea/rlm-tools/issues"
